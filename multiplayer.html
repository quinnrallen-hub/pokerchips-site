<!doctype html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0J9PC4FRSB"></script>
    <script>
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments);}
        gtag('js',new Date());
        gtag('config','G-0J9PC4FRSB');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Multiplayer Poker Game Room | Live Poker Tracker</title>
    <meta name="description" content="Real-time multiplayer poker game with synchronized chip tracking. Play online poker with friends using peer-to-peer connections.">
    <meta name="keywords" content="multiplayer poker game, online poker room, real-time poker, synchronized poker tracker">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://livepokerchips.com/multiplayer.html">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0b0b0d">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="app">
    <header role="banner">
        <a href="index.html" class="brand">
            <span class="chip-mark"></span>
            <span class="wordmark">LIVE<b>POKER</b></span>
        </a>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span id="connectionStatus" class="connection-status">Connecting…</span>
            <span id="roomInfo"></span>
            <a href="connect.html" style="color:var(--muted);text-decoration:none;font-size:13px;font-weight:600">Change Room</a>
            <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:13px;font-weight:600">Single Device</a>
            <a href="https://www.buymeacoffee.com/quinn_dose_tech" target="_blank" rel="noopener"
               style="color:var(--primary);font-size:13px;text-decoration:none">☕</a>
        </div>
    </header>

    <!-- Pot display -->
    <div id="potArea">
        <div id="potChip">
            <div id="pot">0</div>
            <div class="pot-label">POT</div>
        </div>
        <div id="gameStatus">
            <span id="streetName">—</span>
            <span class="status-dot">·</span>
            <span>Bet: <strong id="currentBet">0</strong></span>
        </div>
    </div>

    <!-- Whose turn -->
    <div id="toActBanner">
        <span id="currentPlayerName"></span>'s turn
    </div>

    <!-- Players -->
    <div id="players"></div>

    <!-- Setup -->
    <div id="setup">
        <div class="setup-row">
            <input id="playerName" placeholder="Player name" autocomplete="off" aria-label="Player name">
            <input id="playerStack" placeholder="Stack" type="number" value="1000" style="width:90px" aria-label="Starting stack">
            <button id="addPlayer">Add</button>
        </div>
        <div class="setup-row">
            <label class="toggle-label">
                <input type="checkbox" id="enableBlinds">
                <span>Blinds</span>
            </label>
            <div id="blindsControls" class="hidden">
                <input id="smallBlind" type="number" value="5" style="width:58px" aria-label="Small blind">
                <span style="color:var(--muted)">/</span>
                <input id="bigBlind" type="number" value="10" style="width:58px" aria-label="Big blind">
                <button id="moveButton">Move BTN</button>
            </div>
            <button id="startRound" class="btn-start">Start Round</button>
            <button id="reset">Reset</button>
        </div>
    </div>

    <!-- Sticky action bar -->
    <div id="actionBar">
        <div id="amountRow">
            <button id="amountDown" class="amt-btn" aria-label="Decrease amount">−</button>
            <input id="amount" type="number" min="0" value="10" aria-label="Bet amount">
            <button id="amountUp" class="amt-btn" aria-label="Increase amount">+</button>
            <button class="preset" data-preset="min">Min</button>
            <button class="preset" data-preset="half">½ Pot</button>
            <button class="preset" data-preset="pot">Pot</button>
            <button class="preset" data-preset="allin">All In</button>
        </div>
        <div id="primaryActions">
            <button id="foldBtn"  class="action-btn btn-fold">Fold</button>
            <button id="checkBtn" class="action-btn btn-check">Check</button>
            <button id="callBtn"  class="action-btn btn-call">Call</button>
            <button id="betBtn"   class="action-btn btn-bet">Bet</button>
            <button id="raiseBtn" class="action-btn btn-raise">Raise</button>
        </div>
        <div id="adminActions">
            <button id="nextBtn">Skip Turn</button>
            <button id="advanceRoundBtn">Next Street</button>
            <button id="emptyPotBtn">Award Pot 🏆</button>
        </div>
    </div>

    <div id="toast"></div>

    <!-- Award pot modal -->
    <div id="emptyPotModal" class="modal">
        <div class="modal-content">
            <h2>Award Pot</h2>
            <div class="pot-preview">
                <span class="muted">Pot:</span>
                <span id="modalPotAmount" class="pot-amount">0</span>
            </div>
            <label>Winner</label>
            <select id="winnerSelect"><option value="">Choose a player…</option></select>
            <div class="modal-buttons">
                <button id="cancelEmptyPot">Cancel</button>
                <button id="confirmEmptyPot" class="btn-award">Award 🏆</button>
            </div>
        </div>
    </div>

    <style>
        .connection-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: .5px;
            padding: 4px 11px; border-radius: 20px;
            border: 1px solid var(--line2);
            background: var(--panel); color: var(--muted);
        }
        #roomInfo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 700; letter-spacing: 1px;
            color: var(--gold); background: rgba(231,189,92,.1);
            padding: 4px 11px; border-radius: 8px; border: 1px solid rgba(231,189,92,.2);
        }
        #toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%) translateY(-8px);
            background: var(--panel2); color: var(--text); padding: 10px 20px; border-radius: 10px;
            border: 1px solid var(--line); font-size: 14px; font-weight: 600; z-index: 300;
            opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
            white-space: nowrap; max-width: calc(100vw - 32px); text-align: center; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.toast-error { border-color: rgba(236,106,106,.4); color: var(--red); }
        #toast.toast-win   { border-color: rgba(231,189,92,.4);  color: var(--gold); }
    </style>

    <script>
        'use strict';

        const CONFIG = {
            DEFAULT_STACK: 1000, DEFAULT_SB: 5, DEFAULT_BB: 10,
            MIN_PLAYERS: 2, MAX_PLAYERS: 10, MAX_NAME_LENGTH: 20,
            ANIMATION_THRESHOLD: 100, ANIMATION_DURATION: 300,
            SYNC_DEBOUNCE: 50
        };

        let state = {
            players: [], pot: 0, sidePots: [], currentBet: 0, currentPlayerIndex: 0,
            roundActive: false, street: 'preflop',
            buttonPosition: 0, minRaise: 0,
            toAct: []
        };

        let peer = null, connections = [], isHost = false, roomCode = null,
            myNickname = null, hasJoined = false;
        let syncTimeout = null;

        const storedRole = sessionStorage.getItem('pokerRole');
        const storedRoom = sessionStorage.getItem('pokerRoomCode');
        const storedName = sessionStorage.getItem('pokerPlayerName');

        if (!storedRole || !storedRoom || !storedName) window.location.href = 'connect.html';

        const $ = id => document.getElementById(id);
        const els = {
            playerName: $('playerName'), playerStack: $('playerStack'),
            pot: $('pot'), currentBet: $('currentBet'),
            currentPlayerName: $('currentPlayerName'), streetName: $('streetName'),
            players: $('players'), amount: $('amount'),
            emptyPotModal: $('emptyPotModal'), winnerSelect: $('winnerSelect'),
            modalPotAmount: $('modalPotAmount'),
            smallBlind: $('smallBlind'), bigBlind: $('bigBlind'),
            blindsControls: $('blindsControls')
        };

        $('roomInfo').textContent = `${storedRoom} · ${storedName}`;
        $('roomInfo').className = 'room-info';

        let _toastTimer;
        const toast = (msg, type = '') => {
            const el = $('toast');
            el.textContent = msg;
            el.className = 'show' + (type ? ' toast-' + type : '');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => { el.className = ''; }, 3000);
        };

        const animateNumber = (el, newValue) => {
            const oldValue = parseInt(el.textContent) || 0;
            if (oldValue === newValue) return;
            el.classList.add('chip-update');
            setTimeout(() => el.classList.remove('chip-update'), CONFIG.ANIMATION_DURATION);
            if (Math.abs(newValue - oldValue) > CONFIG.ANIMATION_THRESHOLD) {
                let current = oldValue;
                const step = (newValue - oldValue) / 10;
                const interval = setInterval(() => {
                    current += step;
                    if ((step > 0 && current >= newValue) || (step < 0 && current <= newValue)) {
                        el.textContent = newValue; clearInterval(interval);
                    } else {
                        el.textContent = Math.round(current);
                    }
                }, 20);
            } else {
                el.textContent = newValue;
            }
        };

        const render = () => {
            animateNumber(els.pot, state.pot);
            animateNumber(els.currentBet, state.currentBet);
            els.streetName.textContent = state.street ? state.street.toUpperCase() : '—';

            const curP = state.roundActive && state.players.length > 0
                ? state.players[state.currentPlayerIndex] : null;

            const atShowdown = state.street === 'showdown';
            const banner = $('toActBanner');
            banner.style.display = curP && !atShowdown ? 'flex' : 'none';
            if (curP) els.currentPlayerName.textContent = curP.name;

            if (curP) {
                const toCall = Math.min(state.currentBet - curP.bet, curP.stack);
                $('callBtn').textContent = toCall > 0 ? `Call ${toCall}` : 'Call';
            }

            // Player tiles
            const n = state.players.length;
            els.players.innerHTML = state.players.map((p, i) => {
                const isActive = i === state.currentPlayerIndex && state.roundActive;
                const isBtn = n >= 2 && i === state.buttonPosition;
                const isSB  = n >= 3 && i === (state.buttonPosition + 1) % n;
                const isBB  = n >= 2 && i === (state.buttonPosition + (n === 2 ? 1 : 2)) % n;
                const isMe  = p.name === myNickname;
                const badges = [
                    isBtn ? '<span class="badge badge-btn">BTN</span>' : '',
                    isSB  ? '<span class="badge badge-sb">SB</span>'  : '',
                    isBB  ? '<span class="badge badge-bb">BB</span>'  : '',
                    isMe  ? '<span class="badge badge-me">YOU</span>' : ''
                ].join('');
                const sub = p.folded ? 'FOLDED' : (p.bet > 0 ? `bet: ${p.bet}` : '');
                return `<div class="player${isActive ? ' active' : ''}${p.folded ? ' folded' : ''}">
                    <div class="player-top">
                        <span class="player-name">${p.name}</span>
                        <span class="player-badges">${badges}</span>
                    </div>
                    <div class="player-stack-row">
                        <span class="chip-glyph"></span>
                        <span class="player-stack">${p.stack.toLocaleString()}</span>
                    </div>
                    <div class="player-sub">${sub}</div>
                </div>`;
            }).join('');

            // Action bar — contextual visibility + turn lock
            const on = state.roundActive && !atShowdown;
            const hasBet = state.currentBet > 0;
            const alreadyIn = curP ? curP.bet >= state.currentBet : false;
            const isMyTurn = on && curP?.name === myNickname;
            $('amountRow').style.display      = on ? 'flex' : 'none';
            $('primaryActions').style.display = on ? 'flex' : 'none';
            $('foldBtn').style.display  = on && hasBet && !alreadyIn ? '' : 'none';
            $('callBtn').style.display  = on && hasBet && !alreadyIn ? '' : 'none';
            $('raiseBtn').style.display = on && hasBet              ? '' : 'none';
            $('checkBtn').style.display = on && (!hasBet || alreadyIn) ? '' : 'none';
            $('betBtn').style.display   = on && !hasBet             ? '' : 'none';
            [$('foldBtn'), $('callBtn'), $('raiseBtn'), $('checkBtn'), $('betBtn')]
                .forEach(b => { if (b.style.display !== 'none') b.disabled = !isMyTurn; });
        };

        const activePlayers = () => state.players.filter(p => !p.folded);

        const rebuildToAct = (excludeIdx = -1) => {
            state.toAct = state.players
                .map((p, i) => ({ p, i }))
                .filter(({ p, i }) => !p.folded && p.stack > 0 && i !== excludeIdx)
                .map(({ i }) => i);
        };

        const addPlayer = () => {
            const name = els.playerName.value.trim().substring(0, CONFIG.MAX_NAME_LENGTH);
            const stack = parseInt(els.playerStack.value) || CONFIG.DEFAULT_STACK;
            if (!name) return toast('Please enter a player name', 'error');
            if (!/^[a-zA-Z0-9\s\-_]+$/.test(name)) return toast('Name can only contain letters, numbers, spaces, - and _', 'error');
            if (state.players.length >= CONFIG.MAX_PLAYERS) return toast(`Maximum ${CONFIG.MAX_PLAYERS} players`, 'error');
            if (stack <= 0 || isNaN(stack)) return toast('Please enter a valid stack amount', 'error');
            state.players.push({ name, stack, bet: 0, folded: false });
            els.playerName.value = '';
            render(); syncState();
        };

        const autoAdvanceStreet = () => {
            const streets = { preflop: 'flop', flop: 'turn', turn: 'river', river: 'showdown' };
            state.street = streets[state.street] || 'showdown';
            render();
        };

        const advanceRound = () => {
            state.sidePots = [];
            state.players.forEach(p => p.bet = 0);
            state.currentBet = 0; state.minRaise = 0;
            const streets = { preflop: 'flop', flop: 'turn', turn: 'river', river: 'showdown' };
            state.street = streets[state.street] || 'showdown';

            if (state.street === 'showdown') {
                state.toAct = [];
                render(); syncState();
                toast('Showdown — award the pot', 'win');
                return;
            }

            rebuildToAct();
            if (state.toAct.length === 0) { advanceRound(); return; }

            const n = state.players.length;
            let idx = (state.buttonPosition + 1) % n;
            for (let i = 0; i < n; i++) {
                if (state.toAct.includes(idx)) break;
                idx = (idx + 1) % n;
            }
            state.currentPlayerIndex = idx;
            render(); syncState();
        };

        const endRound = () => {
            state.pot = 0; state.currentBet = 0; state.currentPlayerIndex = 0;
            state.roundActive = false; state.street = 'preflop';
            state.minRaise = 0; state.toAct = [];
            state.players.forEach(p => { p.bet = 0; p.folded = false; });
            state.buttonPosition = (state.buttonPosition + 1) % Math.max(1, state.players.length);
            render(); syncState();
        };

        const startRound = () => {
            if (state.players.length < CONFIG.MIN_PLAYERS) return toast(`Need at least ${CONFIG.MIN_PLAYERS} players`, 'error');
            if (state.players.filter(p => p.stack > 0).length < CONFIG.MIN_PLAYERS)
                return toast('Not enough players with chips', 'error');
            state.roundActive = true; state.pot = 0; state.street = 'preflop';
            state.toAct = []; state.sidePots = [];
            const n = state.players.length;
            state.players.forEach(p => { p.bet = 0; p.folded = p.stack === 0; });
            const isHeadsUp = n === 2;
            const blindsOn = $('enableBlinds').checked;
            if (blindsOn) {
                const sb = parseInt(els.smallBlind.value) || CONFIG.DEFAULT_SB;
                const bb = parseInt(els.bigBlind.value) || CONFIG.DEFAULT_BB;
                const sbPos = isHeadsUp ? state.buttonPosition : (state.buttonPosition + 1) % n;
                const bbPos = isHeadsUp ? (state.buttonPosition + 1) % n : (state.buttonPosition + 2) % n;
                const sbP = state.players[sbPos], bbP = state.players[bbPos];
                const sbAmt = Math.min(sb, sbP.stack);
                sbP.stack -= sbAmt; sbP.bet = sbAmt; state.pot += sbAmt;
                const bbAmt = Math.min(bb, bbP.stack);
                bbP.stack -= bbAmt; bbP.bet = bbAmt; state.pot += bbAmt;
                state.currentBet = bb; state.minRaise = bb;
                state.currentPlayerIndex = isHeadsUp ? state.buttonPosition : (state.buttonPosition + 3) % n;
                state.toAct = state.players.map((p, i) => p.folded ? null : i).filter(i => i !== null);
            } else {
                state.currentBet = 0; state.minRaise = 0;
                state.currentPlayerIndex = state.buttonPosition;
                rebuildToAct();
            }
            for (let i = 0; i < n; i++) {
                if (!state.players[state.currentPlayerIndex].folded) break;
                state.currentPlayerIndex = (state.currentPlayerIndex + 1) % n;
            }
            render(); syncState();
        };

        const bet = () => {
            if (!state.roundActive) return;
            const amount = parseInt(els.amount.value);
            if (isNaN(amount) || amount <= 0) return toast('Please enter a valid bet amount', 'error');
            const p = state.players[state.currentPlayerIndex];
            if (state.currentBet > 0) return toast('There is already a bet — use Raise instead', 'error');
            if (amount > p.stack) return toast('Not enough chips', 'error');
            p.stack -= amount; p.bet += amount; state.pot += amount;
            state.currentBet = p.bet; state.minRaise = amount;
            rebuildToAct(state.currentPlayerIndex);
            nextPlayer();
        };

        const raise = () => {
            if (!state.roundActive) return;
            const raiseAmount = parseInt(els.amount.value);
            if (isNaN(raiseAmount) || raiseAmount <= 0) return toast('Please enter a valid raise amount', 'error');
            if (state.minRaise > 0 && raiseAmount < state.minRaise)
                return toast(`Minimum raise is ${state.minRaise}`, 'error');
            const p = state.players[state.currentPlayerIndex];
            const toCall = state.currentBet - p.bet;
            const needed = toCall + raiseAmount;
            if (needed > p.stack) return toast('Not enough chips', 'error');
            p.stack -= needed; p.bet += needed; state.pot += needed;
            const prev = state.currentBet;
            state.currentBet = p.bet; state.minRaise = p.bet - prev;
            rebuildToAct(state.currentPlayerIndex);
            nextPlayer();
        };

        const call = () => {
            if (!state.roundActive) return;
            const p = state.players[state.currentPlayerIndex];
            const toCall = Math.min(state.currentBet - p.bet, p.stack);
            p.stack -= toCall; p.bet += toCall; state.pot += toCall;
            state.toAct = state.toAct.filter(i => i !== state.currentPlayerIndex);
            nextPlayer();
        };

        const check = () => {
            if (!state.roundActive) return;
            if (state.players[state.currentPlayerIndex].bet < state.currentBet)
                return toast('Cannot check — must call or fold', 'error');
            state.toAct = state.toAct.filter(i => i !== state.currentPlayerIndex);
            nextPlayer();
        };

        const fold = () => {
            if (!state.roundActive) return;
            state.players[state.currentPlayerIndex].folded = true;
            state.toAct = state.toAct.filter(i => i !== state.currentPlayerIndex);
            nextPlayer();
        };

        const nextPlayer = () => {
            const active = activePlayers();
            if (active.length <= 1 && state.roundActive) {
                const winner = active[0];
                if (winner) {
                    const winAmt = state.pot;
                    winner.stack += winAmt;
                    endRound();
                    toast(`${winner.name} wins ${winAmt}!`, 'win');
                }
                return;
            }
            if (state.toAct.length === 0) { advanceRound(); return; }
            const n = state.players.length;
            let next = (state.currentPlayerIndex + 1) % n;
            for (let i = 0; i < n; i++) {
                if (state.toAct.includes(next)) break;
                next = (next + 1) % n;
            }
            state.currentPlayerIndex = next;
            render(); syncState();
        };

        const moveButton = () => {
            if (state.players.length < 2) return;
            state.buttonPosition = (state.buttonPosition + 1) % state.players.length;
            render(); syncState();
        };

        const resetTable = () => {
            state.pot = 0; state.sidePots = []; state.currentBet = 0;
            state.currentPlayerIndex = 0; state.roundActive = false;
            state.street = 'preflop'; state.toAct = [];
            state.players.forEach(p => { p.bet = 0; p.folded = false; });
            render(); syncState();
        };

        const openEmptyPotModal = () => {
            if (state.pot === 0) return toast('The pot is already empty!', 'error');
            if (!state.players.length) return toast('No players at the table!', 'error');
            els.modalPotAmount.textContent = state.pot;
            els.winnerSelect.innerHTML = '<option value="">Choose a player…</option>' +
                state.players.map((p, i) => `<option value="${i}">${p.name} (${p.stack.toLocaleString()})</option>`).join('');
            els.emptyPotModal.classList.add('active');
        };

        const closeEmptyPotModal = () => {
            els.emptyPotModal.classList.remove('active');
            els.winnerSelect.value = '';
        };

        const awardPotToPlayer = () => {
            const idx = els.winnerSelect.value;
            if (idx === '') return toast('Please select a player!', 'error');
            const winner = state.players[parseInt(idx)]; const amt = state.pot;
            els.pot.style.animation = 'potCollect .5s ease-out';
            setTimeout(() => {
                winner.stack += amt;
                closeEmptyPotModal(); els.pot.style.animation = '';
                endRound();
                toast(`${winner.name} wins ${amt}!`, 'win');
            }, 500);
        };

        // Networking
        const broadcastState = (exclude = null) => {
            const msg = { type: 'state', state };
            connections.forEach(c => { if (c !== exclude && c.open) c.send(msg); });
        };

        const syncState = () => {
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                if (isHost) broadcastState();
                else if (connections[0]?.open) connections[0].send({ type: 'state', state });
            }, CONFIG.SYNC_DEBOUNCE);
        };

        const setStatus = (text, color = 'var(--muted)') => {
            const el = $('connectionStatus');
            el.textContent = text;
            el.style.color = color;
            el.style.borderColor = color === 'var(--muted)' ? 'var(--border)' : color;
        };

        const initHost = () => {
            isHost = true; hasJoined = true; myNickname = storedName; roomCode = storedRoom;
            state.players = [{ name: myNickname, stack: 1000, bet: 0, folded: false }];
            state.currentPlayerIndex = 0;
            setStatus('Creating room…');

            peer = new Peer('poker-' + roomCode, {
                debug: 2,
                config: { iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]}
            });

            const hostTimeout = setTimeout(() => {
                if (!peer || !peer.open) {
                    setStatus('Connection failed', 'var(--red)');
                    toast('Failed to connect to PeerJS server. Please refresh and try again.', 'error');
                }
            }, 10000);

            peer.on('open', id => {
                clearTimeout(hostTimeout);
                setStatus('✓ Room Active', 'var(--green)');
                console.log('Host ready, room:', roomCode);
            });

            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('data', data => {
                    if (data.type === 'state') {
                        const senderIsCurrentPlayer = !state.roundActive ||
                            !conn.playerName ||
                            conn.playerName === state.players[state.currentPlayerIndex]?.name;
                        if (senderIsCurrentPlayer) {
                            state = data.state;
                            render();
                            broadcastState(conn);
                        }
                    } else if (data.type === 'join') {
                        conn.playerName = data.playerName;
                        state.players.push({ name: data.playerName, stack: 1000, bet: 0, folded: false });
                        render();
                        broadcastState();
                    }
                });
                conn.on('close', () => {
                    connections = connections.filter(c => c !== conn);
                });
            });

            peer.on('error', err => {
                setStatus('Error: ' + err.type, 'var(--red)');
            });

            render();
        };

        const joinGame = () => {
            hasJoined = true; myNickname = storedName; roomCode = storedRoom;
            setStatus('Connecting…');

            peer = new Peer({
                debug: 2,
                config: { iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]}
            });

            peer.on('open', () => {
                setStatus('Finding room…');
                setTimeout(() => {
                    const conn = peer.connect('poker-' + roomCode, { reliable: true });
                    connections.push(conn);
                    let connected = false;

                    const timeout = setTimeout(() => {
                        if (!connected) {
                            setStatus('Connection failed', 'var(--red)');
                            toast('Could not connect to room. Make sure the host has opened their game first.', 'error');
                        }
                    }, 15000);

                    conn.on('open', () => {
                        connected = true; clearTimeout(timeout);
                        setStatus('✓ Connected', 'var(--green)');
                        conn.send({ type: 'join', playerName: myNickname });
                    });

                    conn.on('data', data => {
                        if (data.type === 'state') { state = data.state; render(); }
                    });

                    conn.on('close', () => {
                        setStatus('Disconnected', 'var(--red)');
                        toast('Disconnected from room.', 'error');
                    });

                    conn.on('error', err => {
                        connected = true; clearTimeout(timeout);
                        setStatus('Error', 'var(--red)');
                        toast('Failed to connect to room.', 'error');
                    });
                }, 2000);
            });

            peer.on('error', err => {
                setStatus('Error: ' + err.type, 'var(--red)');
                if (err.type === 'peer-unavailable')
                    toast('Room not found! Make sure the host opened their game first.', 'error');
            });
        };

        // Amount presets
        document.querySelectorAll('.preset').forEach(btn => {
            btn.onclick = () => {
                const p = state.players[state.currentPlayerIndex];
                const bb = parseInt(els.bigBlind.value) || CONFIG.DEFAULT_BB;
                const presets = {
                    min:   state.minRaise || bb,
                    half:  Math.max(1, Math.floor(state.pot / 2)),
                    pot:   state.pot,
                    allin: p ? Math.max(0, p.stack - Math.max(0, state.currentBet - p.bet)) : 0
                };
                els.amount.value = Math.max(0, presets[btn.dataset.preset] || 0);
            };
        });

        const amountStep = () => Math.max(1, state.minRaise || parseInt(els.bigBlind.value) || CONFIG.DEFAULT_BB);
        $('amountDown').onclick = () => els.amount.value = Math.max(0, (parseInt(els.amount.value) || 0) - amountStep());
        $('amountUp').onclick   = () => els.amount.value = (parseInt(els.amount.value) || 0) + amountStep();

        $('addPlayer').onclick       = addPlayer;
        $('startRound').onclick      = startRound;
        $('moveButton').onclick      = moveButton;
        $('reset').onclick           = resetTable;
        $('betBtn').onclick          = bet;
        $('raiseBtn').onclick        = raise;
        $('callBtn').onclick         = call;
        $('checkBtn').onclick        = check;
        $('foldBtn').onclick         = fold;
        $('nextBtn').onclick         = () => { state.toAct = state.toAct.filter(i => i !== state.currentPlayerIndex); nextPlayer(); };
        $('advanceRoundBtn').onclick = advanceRound;
        $('emptyPotBtn').onclick     = openEmptyPotModal;
        $('confirmEmptyPot').onclick = awardPotToPlayer;
        $('cancelEmptyPot').onclick  = closeEmptyPotModal;
        els.emptyPotModal.onclick    = e => { if (e.target === els.emptyPotModal) closeEmptyPotModal(); };
        els.playerName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlayer(); } });
        $('enableBlinds').addEventListener('change', e => {
            els.blindsControls.classList.toggle('hidden', !e.target.checked);
        });

        if (storedRole === 'host') initHost();
        else if (storedRole === 'client') joinGame();

        render();
    </script>
</body>
</html>
