    <style>
        /* Connect page specific styles */
        body{min-height:100vh}
        .connect-main{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:24px}
        .connect-box{background:var(--panel);padding:44px 40px;border-radius:24px;border:1px solid var(--line);box-shadow:0 24px 64px rgba(0,0,0,0.5);text-align:center;max-width:460px;width:100%;animation:fadeIn .5s ease-out}
        .lobby-mark{width:56px;height:56px;border-radius:50%;margin:0 auto 22px;position:relative;background:radial-gradient(circle at 38% 34%, #f3d488, var(--gold) 55%, var(--gold-d));box-shadow:0 6px 18px rgba(231,189,92,.25), inset 0 0 0 4px rgba(0,0,0,.4)}
        .lobby-mark::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(0,0,0,.5)}
        h1{font-size:26px;font-weight:700;margin:0 0 8px 0;letter-spacing:-.5px}
        .sub{color:var(--muted);margin:0 0 30px 0;font-size:15px}
        .field-label{display:block;text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px}
        .connect-box input{width:100%;text-align:center;font-size:16px;padding:14px;margin:0 0 18px}
        #joinCode{font-family:'JetBrains Mono',monospace;letter-spacing:4px;text-transform:uppercase}
        .connect-box button{width:100%;font-size:16px;font-weight:700;padding:15px;margin:0}
        #hostGame{background:var(--gold);border-color:var(--gold);color:#18130a;box-shadow:0 6px 18px rgba(231,189,92,.22)}
        #hostGame:hover{background:#f0c869}
        .divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase}
        .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line2)}
        .status{margin-top:24px;padding:12px;background:var(--bg-card-dark);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.5px;color:var(--muted);border:1px solid var(--line2)}
        .lobby-foot{margin-top:24px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
        .lobby-foot a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
        .lobby-foot a:hover{color:var(--gold)}
        @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:768px){.connect-box{padding:32px 22px}h1{font-size:23px}}
    </style>

<body>
    <header role="banner" class="site-header">
        <a href="index.html" class="brand">
            <span class="chip-mark"></span>
            <span class="wordmark"><span data-i18n="index.1">LIVE</span><b><span data-i18n="index.2">POKER</span></b></span>
        </a>
        <nav role="navigation">
            <a href="index.html"><span data-i18n="Tracker">Tracker</span></a>
            <a href="about.html"><span data-i18n="index.3">About</span></a>
            <a href="guide.html"><span data-i18n="index.4">Guide</span></a>
            <a href="blog.html"><span data-i18n="index.5">Strategy</span></a>
            <a href="connect.html" aria-current="page"><span data-i18n="index.6">Multiplayer</span></a>
        </nav>
    <div class="language-control"><label for="languageSelect">Language / 语言</label><select id="languageSelect" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></div>
    </header>
    <main class="connect-main">
    <div class="connect-box">
        <div class="lobby-mark"></div>
        <h1><span data-i18n="connect.1">Play together, online</span></h1>
        <p class="sub"><span data-i18n="connect.2">Host a room or join with a code. Every device stays in sync in real time — no accounts, no server.</span></p>

        <label class="field-label" for="playerName"><span data-i18n="connect.3">Your name</span></label>
        <input id="playerName" placeholder="e.g. Quinn" maxlength="20" autocomplete="off" data-i18n-attributes="{&quot;placeholder&quot;: &quot;connect.4&quot;}">
        <button id="hostGame"><span data-i18n="connect.5">Host New Game</span></button>

        <div class="divider"><span data-i18n="connect.6">or join one</span></div>

        <label class="field-label" for="joinCode"><span data-i18n="connect.7">Room code</span></label>
        <input id="joinCode" placeholder="6-CHAR CODE" autocomplete="off" data-i18n-attributes="{&quot;placeholder&quot;: &quot;connect.8&quot;}">
        <button id="joinGame"><span data-i18n="connect.9">Join Game</span></button>

        <div id="status" class="status"><span data-i18n="connect.10">Not connected</span></div>

        <div class="lobby-foot">
            <a href="index.html"><span data-i18n="connect.11">← Single device</span></a>
            <a href="https://www.buymeacoffee.com/quinn_dose_tech" target="_blank" rel="noopener"><span data-i18n="connect.12">Support the dev</span></a>
        </div>
    </div>
    </main>

    <script>
        'use strict';
        const statusEl=document.getElementById('status');
        const nameEl=document.getElementById('playerName');

        document.getElementById('hostGame').onclick=()=>{
            const name=nameEl.value.trim();
            if(!name)return alert(I18n.t('Please enter your name first!'));
            if(!/^[\p{Script=Han}a-zA-Z0-9\s\-_]+$/u.test(name))return alert(I18n.t('Name can only contain Chinese characters, letters, numbers, spaces, - and _'));
            const roomCode=Math.random().toString(36).substring(2,8).toUpperCase();
            sessionStorage.setItem('pokerRole','host');
            sessionStorage.setItem('pokerRoomCode',roomCode);
            sessionStorage.setItem('pokerPlayerName',name);
            window.location.href='multiplayer.html';
        };

        document.getElementById('joinGame').onclick=()=>{
            const name=nameEl.value.trim();
            if(!name)return alert(I18n.t('Please enter your name first!'));
            if(!/^[\p{Script=Han}a-zA-Z0-9\s\-_]+$/u.test(name))return alert(I18n.t('Name can only contain Chinese characters, letters, numbers, spaces, - and _'));
            const code=document.getElementById('joinCode').value.trim().toUpperCase();
            if(!code)return alert(I18n.t('Please enter a room code'));
            sessionStorage.setItem('pokerRole','client');
            sessionStorage.setItem('pokerRoomCode',code);
            sessionStorage.setItem('pokerPlayerName',name);
            window.location.href='multiplayer.html';
        };

        document.getElementById('joinCode').addEventListener('keydown',e=>{
            if(e.key==='Enter'){e.preventDefault();document.getElementById('joinGame').click()}
        });

        nameEl.addEventListener('keydown',e=>{
            if(e.key==='Enter'){e.preventDefault();document.getElementById('hostGame').click()}
        });
    </script>
</body>
