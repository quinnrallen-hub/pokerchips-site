    <meta charset="utf-8">

    <title>Multiplayer Poker - Connect & Play Online | Live Poker Tracker</title>
    <meta name="description" content="Connect to multiplayer poker games with friends. Host or join online poker rooms using our free peer-to-peer poker tracker. No registration required.">

    <style>
        /* Connect page specific styles */
        body{display:flex;align-items:center;justify-content:center}
        button,input{font-size:16px;padding:12px 24px;margin:8px}
        input{width:220px;text-align:center}
        .connect-box{background:var(--bg-card);backdrop-filter:blur(10px);padding:48px;border-radius:16px;border:1px solid var(--border);box-shadow:0 16px 48px rgba(0,0,0,0.6);text-align:center;max-width:500px;width:90%;animation:fadeIn .6s ease-out}
        h1{font-size:32px;margin:0 0 16px 0}
        p{color:var(--text-muted);margin:0 0 32px 0;font-size:16px}
        .divider{margin:24px 0;color:var(--text-muted);font-size:14px;text-transform:uppercase;letter-spacing:1px}
        .status{margin-top:24px;padding:12px;background:var(--bg-card-dark);border-radius:8px;font-size:14px;color:var(--text-muted)}
        a{color:var(--primary);text-decoration:none;font-size:14px;display:inline-block;margin-top:24px}
        a:hover{text-decoration:underline}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:768px){
            body{padding:16px}
            .connect-box{padding:32px 24px;width:95%}
            h1{font-size:28px}
            p{font-size:15px;margin-bottom:24px}
            button,input{font-size:15px;padding:10px 20px;margin:6px}
            input{width:100%;max-width:280px}
            .divider{margin:20px 0;font-size:13px}
            .status{font-size:13px;padding:10px}
            a{font-size:13px;margin-top:20px}
        }
    </style>
</head>
<body>
    <div class="connect-box">
        <h1>Live Poker</h1>
        <p>Connect to play with others online</p>

        <button id="hostGame">Host New Game</button>

        <div class="divider">or</div>

        <input id="joinCode" placeholder="Enter Room Code">
        <br>
        <button id="joinGame">Join Game</button>

        <div id="status" class="status">Not connected</div>

        <div style="margin-top:24px;display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap">
            <a href="index.html" style="color:var(--primary);text-decoration:none;font-size:14px">← Back to Single Device</a>
            <a href="https://www.buymeacoffee.com/quinn_dose_tech" target="_blank" rel="noopener" style="display:inline-block;padding:6px 12px;background:rgba(255,209,102,0.15);color:#ffd166;text-decoration:none;border-radius:6px;font-weight:500;font-size:14px;border:1px solid rgba(255,209,102,0.3);transition:all 0.2s" onmouseover="this.style.background='rgba(255,209,102,0.25)';this.style.borderColor='rgba(255,209,102,0.5)'" onmouseout="this.style.background='rgba(255,209,102,0.15)';this.style.borderColor='rgba(255,209,102,0.3)'">☕ Support</a>
        </div>
    </div>

    <script>
        'use strict';
        const statusEl=document.getElementById('status');

        document.getElementById('hostGame').onclick=()=>{
            const name=prompt('Enter your player name:');
            if(!name?.trim())return alert('Player name is required!');
            const roomCode=Math.random().toString(36).substring(2,8).toUpperCase();

            sessionStorage.setItem('pokerRole','host');
            sessionStorage.setItem('pokerRoomCode',roomCode);
            sessionStorage.setItem('pokerPlayerName',name.trim());
            window.location.href='multiplayer.html';
        };

        document.getElementById('joinGame').onclick=()=>{
            const code=document.getElementById('joinCode').value.trim().toUpperCase();
            if(!code)return alert('Please enter a room code');
            const name=prompt('Enter your player name:');
            if(!name?.trim())return alert('Player name is required!');

            sessionStorage.setItem('pokerRole','client');
            sessionStorage.setItem('pokerRoomCode',code);
            sessionStorage.setItem('pokerPlayerName',name.trim());
            window.location.href='multiplayer.html';
        };

        document.getElementById('joinCode').addEventListener('keydown',e=>{
            if(e.key==='Enter'){e.preventDefault();document.getElementById('joinGame').click()}
        });
    </script>
</body>
</html>
